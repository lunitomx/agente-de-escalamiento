id: tool-pricing-lever
type: tool
name: Pricing as a Cash Lever
name_es: El Precio como Palanca de Efectivo
decision: cash
summary: >
  The first and most powerful of the Power of One's seven levers. A 1% price increase
  on existing revenue flows almost entirely to gross margin and EBIT — with zero working
  capital consumption. Unlike volume growth (which requires more staff, inventory, and
  receivables), price improvement is pure margin. Key analysis: calculate the revenue
  lost if a 1% price increase causes customers to defect vs. the margin gained if they
  don't. Most businesses under-price because they fear customer loss, not because their
  pricing is actually competitive.
