id: tool-simple-numbers
type: tool
name: Simple Numbers Framework
name_es: Marco de Numeros Simples (Simple Numbers)
decision: cash
summary: >
  A financial management view that simplifies business finance to four key numbers:
  Revenue, Gross Margin, Operating Expenses, and Net Profit (EBIT). It strips out
  non-operating noise and helps leaders inspect labor efficiency as a percentage of
  gross margin dollars. The company sets explicit profit and cash targets from its own
  model and validates them against documented industry evidence.
relationships:
  - type: belongs-to
    target: decision-cash
  - type: requires
    target: concept-gross-margin
  - type: requires
    target: concept-revenue-per-employee
tags: [cash, Simple-Numbers, Crabtree, profit, gross-margin, labor-efficiency, EBIT]
metadata:
  difficulty: intermediate
  time_estimate: "Half day to restructure P&L into Simple Numbers format"
  frequency: monthly
