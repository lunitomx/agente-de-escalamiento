id: concept-revenue-per-employee
type: concept
name: Revenue per Employee
name_es: Ingresos por Empleado
decision: cash
summary: >
  A labor efficiency metric: total revenue divided by total headcount. Scaling Up and
  Simple Numbers use this as a proxy for whether the company is scaling productively.
  World-class companies generate $150K–$500K+ revenue per employee depending on industry.
  Declining revenue per employee signals that hiring is outpacing revenue growth —
  a common warning sign before a cash crisis. Growing companies should increase revenue
  per employee over time as systems and processes improve efficiency.
