id: concept-revenue-per-employee
type: concept
name: Revenue per Employee
name_es: Ingresos por Empleado
decision: cash
summary: >
  A labor efficiency metric: total revenue divided by total headcount. Use it as a proxy
  for whether the company is scaling productively. Declining revenue per employee signals
  that hiring may be outpacing revenue growth —
  a common warning sign before a cash crisis. Growing companies should increase revenue
  per employee over time as systems and processes improve efficiency.
relationships:
  - type: belongs-to
    target: decision-cash
  - type: measured-by
    target: metric-revenue-per-employee
  - type: feeds-into
    target: tool-simple-numbers
tags: [cash, revenue-per-employee, efficiency, headcount, scaling, Simple-Numbers]
metadata:
  difficulty: beginner
  application: >
    Track monthly: total revenue ÷ total headcount. If declining, investigate hiring,
    pricing, delivery capacity, and revenue quality before adding headcount. Compare with
    a documented industry benchmark and the company's own baseline.
