tags: [cash, revenue-per-employee, efficiency, headcount, scaling, Simple-Numbers]
metadata:
  difficulty: beginner
  application: >
    Track monthly: total revenue ÷ total headcount. If declining, pause hiring until
    revenue per employee recovers. Industry benchmark varies: services $150K+,
    SaaS $200K+, manufacturing $250K+.
