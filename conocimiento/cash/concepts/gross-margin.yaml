id: concept-gross-margin
type: concept
name: Gross Margin
name_es: Margen Bruto
decision: cash
summary: >
  Revenue minus direct costs (cost of goods sold), expressed as a percentage of revenue.
  Scaling Up, co-written with Greg Crabtree (Simple Numbers), treats gross margin dollars
  — not revenue — as the "real top line." Revenue can grow while gross margin shrinks,
  masking a deteriorating business model. Sustainable growth requires growing gross margin
  dollars AND maintaining or improving gross margin percentage. Target gross margins
  vary by industry: SaaS 70%+, professional services 50%+, manufacturing 30%+.
