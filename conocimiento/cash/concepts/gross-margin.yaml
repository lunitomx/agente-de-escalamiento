id: concept-gross-margin
type: concept
name: Gross Margin
name_es: Margen Bruto
decision: cash
summary: >
  Revenue minus direct costs (cost of goods sold), expressed as a percentage of revenue.
  Track gross margin dollars alongside revenue because revenue can grow while gross
  margin shrinks,
  masking a deteriorating business model. Sustainable growth requires growing gross margin
  dollars AND maintaining or improving gross margin percentage. Compare the percentage
  with documented benchmarks for the company's industry and business model.
relationships:
  - type: belongs-to
    target: decision-cash
  - type: measured-by
    target: metric-gross-margin-percentage
  - type: feeds-into
    target: tool-simple-numbers
  - type: feeds-into
    target: tool-power-of-one
tags: [cash, gross-margin, profitability, Simple-Numbers, Crabtree, top-line]
metadata:
  difficulty: intermediate
  application: >
    Track gross margin % monthly alongside gross margin dollars. Alert: revenue
    growing but GM% declining means you are buying revenue — not building a business.
    Identify which product lines, customers, or pricing decisions are compressing margins.
