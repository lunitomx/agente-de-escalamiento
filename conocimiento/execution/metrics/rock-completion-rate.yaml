id: metric-rock-completion-rate
type: metric
name: Rock Completion Rate
name_es: Tasa de Completacion de Rocas
decision: execution
summary: >
  The percentage of quarterly Rocks completed by the end of the quarter. A Rock is
  complete when the defined outcome is fully achieved — not "mostly done." A declining
  rate may indicate that Rocks are too ambitious, under-resourced, or displaced by
  operational fires. Diagnose the system and evidence before attributing failure to an
  individual. Track at both company and individual levels.
relationships:
  - type: belongs-to
    target: decision-execution
  - type: measured-by
    target: concept-priorities-rocks
tags: [execution, metric, rocks, completion, quarterly, accountability]
metadata:
  unit: percentage
  direction: higher_better
  benchmark: "Compare with the committed quarterly target and prior quarters"
