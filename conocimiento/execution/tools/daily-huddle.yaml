id: tool-daily-huddle
type: tool
name: Daily Huddle
name_es: Reunion Diaria (Daily Huddle)
decision: execution
summary: >
  A standing 15-minute daily meeting where each team member answers three questions:
  (1) What's up? (brief personal check-in, 1 sentence), (2) Daily metrics — are they
  on track or off track? (3) Where are you stuck? (one blocker the team can help with).
  No problem-solving in the huddle — stuck items get a follow-up meeting with the
  relevant people only. The daily huddle replaces dozens of ad-hoc interruptions
  throughout the day. Conducted at the same time, standing up, every business day.
