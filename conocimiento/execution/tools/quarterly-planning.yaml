id: tool-quarterly-planning
type: tool
name: Quarterly Planning Session
name_es: Sesion de Planeacion Trimestral
decision: execution
summary: >
  A 1-2 day offsite session held at the end of each quarter to review results, set the
  next quarter's Critical Number, define 3-5 Rocks, design the Quarterly Theme, and
  cascade priorities to all teams. Agenda: review prior quarter's Rocks (what got done,
  what didn't, why), review KPIs and Critical Number, SWT update, set new Critical Number,
  set company Rocks, announce Quarterly Theme and celebration. Each department then holds
  its own session to cascade team-level Rocks aligned with the company Rocks.
