id: tool-scoreboard
type: tool
name: Scoreboard
name_es: Marcador de Desempeno
decision: execution
summary: >
  A visible, real-time display of the Critical Number, KPIs, and Rock status posted
  throughout the company (physical or digital). Scoreboards make progress transparent
  to every employee without requiring a meeting. The best scoreboards are updated weekly,
  include both the current value and the target, and show trend direction. Companies with
  visible scoreboards see 2x the focus on Key metrics vs those that share data only in
  meetings. The scoreboard is the physical embodiment of the Quarterly Theme.
