id: tool-annual-planning
type: tool
name: Annual Planning Session
name_es: Sesion de Planeacion Anual
decision: execution
summary: >
  A 2-3 day session held before year-end to refresh the full OPSP, set annual priorities
  (Chapters), update the BHAG progress, run a fresh SWT analysis, and define Q1 Rocks.
  The annual session is the most strategic of the five meeting types — it connects
  day-to-day execution back to the 25-year BHAG. Leadership team attends in full.
  Output: updated OPSP, 3-5 annual priorities (Chapters), Q1 Critical Number and Rocks.
relationships:
