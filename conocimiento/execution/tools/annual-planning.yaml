    target: decision-execution
  - type: requires
    target: concept-meeting-rhythm
  - type: feeds-into
    target: tool-quarterly-planning
tags: [execution, annual-planning, OPSP, strategy, rhythm, offsite]
metadata:
  difficulty: advanced
  time_estimate: "2-3 days"
  frequency: annually
