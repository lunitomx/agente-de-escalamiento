id: tool-execution-habits
type: tool
name: Execution Habits Checklist
name_es: Lista de Habitos de Ejecucion
decision: execution
summary: >
  Ten fundamental execution habits that, when practiced consistently, drive organizational
  alignment and performance. The habits cover: priorities clarity, critical data visibility, meeting rhythm,
  accountability structure, employee and customer feedback loops, and core values
  visibility. Each habit is a yes/no checkable behavior. Companies score themselves
  quarterly and focus improvement on their lowest-scoring habit.
