id: registry-worksheets
type: registry
name: Worksheet Registry
name_es: Registro de Hojas de Trabajo
description: >
  Central index of all 21 worksheets across the 4 ESCALA decisions.
  Enables deterministic lookup by decision, prerequisite, or output type.
total_worksheets: 21
worksheets:

  # ── PEOPLE (4) ─────────────────────────────────────────────────────────────

  - id: worksheet-face
    decision: people
    name: FACE Worksheet
    name_es: "FACe"
    node_path: people/worksheets/face.yaml
    prerequisites: []
    outputs:
      - role-fit-score
      - values-alignment-score
    difficulty: intermediate
    time_estimate: "2-4 hours per role"
    time_es: "2-4 horas por puesto"
    summary_es: "Pon un solo nombre al frente de cada función del negocio, con los indicadores que sigue y las cuentas de resultados que le tocan."
    frequency: quarterly
    tags: [people, hiring, fit, accountability]

  - id: worksheet-love-loathe
    decision: people
    name: Love/Loathe Worksheet
    name_es: "Amor/Odio"
    node_path: people/worksheets/love-loathe.yaml
    prerequisites: [worksheet-face]
    outputs:
      - role-redesign recommendations
      - delegation candidates
    difficulty: beginner
    time_estimate: "1-2 hours per person"
    time_es: "1-2 horas por persona"
    summary_es: "Cada persona anota sus 5 tareas semanales más importantes y marca cuáles le dan energía y cuáles se la quitan. Las que se la quitan son candidatas a delegar."
    frequency: semi-annual
    tags: [people, energy, delegation, role-design]

  - id: worksheet-oppp
    decision: people
    name: One-Page Personal Plan (OPPP) Worksheet
    name_es: "Plan personal de una página"
    node_path: people/worksheets/oppp.yaml
    prerequisites: [worksheet-face, worksheet-love-loathe]
    outputs:
      - personal-development plan per employee
      - quarterly personal rocks
    difficulty: intermediate
    time_estimate: "2-3 hours per employee"
    time_es: "2-3 horas por colaborador"
    summary_es: "Tu plan personal en una página: ocho áreas de tu vida, qué quieres lograr en cada una y qué vas a empezar y dejar de hacer."
    frequency: quarterly
    tags: [people, development, personal-plan, accountability]

  - id: worksheet-team-growth
    decision: people
    name: Team Growth Assessment Worksheet
    name_es: "Crecimiento del equipo"
    node_path: people/worksheets/team-growth.yaml
    prerequisites: [worksheet-face]
    outputs:
      - team maturity score
      - hiring priorities
    difficulty: intermediate
    time_estimate: "2 hours"
    time_es: "2 horas"
    summary_es: "Califica del 1 al 5 a la empresa y a ti en tres temas: cómo recibes a la gente nueva, cómo la acompañas cada semana y cómo la sigues formando. El promedio más bajo dice dónde empezar."
    frequency: annual
    tags: [people, team, growth, hiring]

  # ── STRATEGY (10) ──────────────────────────────────────────────────────────

  - id: worksheet-opsp
    decision: strategy
    name: One-Page Strategic Plan (OPSP) Worksheet
    name_es: "Plan estratégico de una página"
    node_path: strategy/worksheets/opsp.yaml
    prerequisites:
      - worksheet-face
      - worksheet-swt
    outputs:
      - completed OPSP with BHAG, 3-5 year targets, annual priorities
      - company Rocks for the quarter
    difficulty: advanced
    time_estimate: "4-8 hours first time; 2-4 hours quarterly update"
    time_es: "4-8 horas la primera vez; 2-4 horas cada trimestre"
    summary_es: "Tu plan estratégico completo en una sola página: lo que te define, a dónde quieres llegar en varios años y qué harás este año y este trimestre para lograrlo."
    frequency: quarterly
    tags: [strategy, planning, alignment, BHAG, OPSP]

  - id: worksheet-swt
    decision: strategy
    name: SWT Analysis Worksheet
    name_es: "Fortalezas, debilidades y tendencias (SWT)"
    node_path: strategy/worksheets/swt.yaml
    prerequisites: []
    outputs:
      - strengths inventory
      - weaknesses to address
      - trends affecting the business
    difficulty: intermediate
    time_estimate: "2-4 hours"
    time_es: "2-4 horas"
    summary_es: "El equipo directivo anota las fortalezas y debilidades de la empresa y las tendencias de afuera que la van a afectar."
    frequency: annual
    tags: [strategy, SWT, strengths, weaknesses, trends]

  - id: worksheet-7-strata
    decision: strategy
    name: 7 Strata of Strategy Worksheet
    name_es: "7 estratos de estrategia"
    node_path: strategy/worksheets/7-strata.yaml
    prerequisites: [worksheet-swt]
    outputs:
      - completed 7-strata map
      - brand promise with guarantee
      - differentiating activities identified
    difficulty: advanced
    time_estimate: "Full day"
    time_es: "Un día completo"
    summary_es: "Revisa capa por capa tu estrategia, desde a quién le vendes hasta tu meta de largo plazo, para ver si de verdad te distingue de la competencia."
    frequency: annual
    tags: [strategy, differentiation, brand-promise, competitive-moat]

  - id: worksheet-core-customer
    decision: strategy
    name: Core Customer Worksheet
    name_es: "Cliente central"
    node_path: strategy/worksheets/core-customer.yaml
    prerequisites: []
    outputs:
      - core customer profile
      - demographic and psychographic data
      - key needs and decision drivers
    difficulty: intermediate
    time_estimate: "2-3 hours"
    time_es: "2-3 horas"
    summary_es: "Describe a tu mejor cliente con casos reales: qué quiere, qué necesita y qué teme. Termina en una frase corta que todo tu equipo entienda."
    frequency: annual
    tags: [strategy, customer, segmentation, targeting]

  - id: worksheet-brand-promise
    decision: strategy
    name: Brand Promise Worksheet
    name_es: "Promesa de marca"
    node_path: strategy/worksheets/brand-promise.yaml
    prerequisites: [worksheet-core-customer]
    outputs:
      - main brand promise with weekly measure
      - 2 supporting promises with weekly measures
      - guarantee and anti-promises
    difficulty: intermediate
    time_estimate: "1-2 hours"
    time_es: "1-2 horas"
    summary_es: "Escribe la promesa principal a tu cliente y dos promesas de apoyo, cada una con una medida semanal. Respalda una con una garantía y nombra lo que no vas a prometer."
    frequency: annual
    tags: [strategy, brand-promise, guarantee, measurement]

  - id: worksheet-bmc
    decision: strategy
    name: Business Model Canvas Worksheet
    name_es: "Lienzo del modelo de negocio"
    node_path: strategy/worksheets/bmc.yaml
    prerequisites: []
    outputs:
      - nine-block business model
      - next strategy sheet per block
    difficulty: intermediate
    time_estimate: "1-2 hours"
    time_es: "1-2 horas"
    summary_es: "Dibuja en nueve bloques cómo funciona hoy tu negocio, empezando por el cliente: a quién sirves, qué le resuelves, cómo le llegas y cómo te paga."
    frequency: annual
    tags: [strategy, business-model, canvas]

  - id: worksheet-differentiating-activities
    decision: strategy
    name: Differentiating Activities Worksheet
    name_es: "Actividades diferenciadoras"
    node_path: strategy/worksheets/differentiating-activities.yaml
    prerequisites: [worksheet-core-customer]
    outputs:
      - 3 to 5 differentiating activities
      - competitor comparison on 4 axes
    difficulty: advanced
    time_estimate: "1-2 hours"
    time_es: "1-2 horas"
    summary_es: "Compárate con 2 o 3 competidores y elige de 3 a 5 actividades que se apoyan entre sí y que a ellos les cuesta copiar."
    frequency: annual
    tags: [strategy, differentiation, competitors]

  - id: worksheet-sandbox
    decision: strategy
    name: Sandbox Worksheet
    name_es: "Caja de arena"
    node_path: strategy/worksheets/sandbox.yaml
    prerequisites: [worksheet-core-customer]
    outputs:
      - zones where you compete and where you do not
      - 3 to 5 product or service categories
      - channels by customer type
      - 3 to 5 possible changes in 3 to 5 years
    difficulty: intermediate
    time_estimate: "1-2 hours"
    time_es: "1-2 horas"
    summary_es: "Decide dónde compites y dónde no: zonas, categorías de producto o servicio, clientes y canales, y cómo cambiará eso en 3 a 5 años."
    frequency: annual
    tags: [strategy, sandbox, focus, market]

  - id: worksheet-strategy-canvas
    decision: strategy
    name: Strategy Canvas Worksheet
    name_es: "Lienzo de estrategia"
    node_path: strategy/worksheets/strategy-canvas.yaml
    prerequisites:
      - worksheet-core-customer
      - worksheet-brand-promise
      - worksheet-differentiating-activities
      - worksheet-sandbox
    outputs:
      - the 4 strategy pieces on one page
      - what the company says no to
    difficulty: intermediate
    time_estimate: "30-60 minutes"
    time_es: "30-60 minutos"
    summary_es: "Junta en una página las 4 piezas de tu estrategia que ya llenaste y decide a qué le vas a decir que no."
    frequency: quarterly
    tags: [strategy, canvas, focus, alignment]

  - id: worksheet-vision-summary
    decision: strategy
    name: Vision Summary Worksheet
    name_es: "Resumen de visión"
    node_path: strategy/worksheets/vision-summary.yaml
    prerequisites:
      - worksheet-core-customer
    outputs:
      - one-page vision summary
      - 10-week commitment
    difficulty: intermediate
    time_estimate: "1-2 hours"
    time_es: "1-2 horas"
    summary_es: "Junta en una página tus valores, propósito, promesas, meta grande, prioridades y números de cada semana, y cierra con un compromiso para las próximas 10 semanas."
    frequency: quarterly
    tags: [strategy, vision-summary, one-page]

  # ── EXECUTION (4) ──────────────────────────────────────────────────────────

  - id: worksheet-execution-habits
    decision: execution
    name: Execution Habits Checklist Worksheet
    name_es: "Hábitos de ejecución"
    node_path: execution/worksheets/execution-habits.yaml
    prerequisites: [worksheet-opsp]
    outputs:
      - habits score (0-10 per habit)
      - priority habit to improve this quarter
    difficulty: beginner
    time_estimate: "30 minutes"
    time_es: "30 minutos"
    summary_es: "Una lista de 10 hábitos que el equipo directivo califica cada trimestre. El hábito con la calificación más baja se vuelve el foco de los siguientes 90 días."
    frequency: quarterly
    tags: [execution, habits, alignment, accountability, checklist]

  - id: worksheet-quarterly-priorities
    decision: execution
    name: Quarterly Priorities and Rocks Worksheet
    name_es: "Prioridades y rocas trimestrales"
    node_path: execution/worksheets/quarterly-priorities.yaml
    prerequisites: [worksheet-opsp, worksheet-execution-habits]
    outputs:
      - company Critical Number for the quarter
      - 3-5 company Rocks with owners and deadlines
      - Quarterly Theme
    difficulty: intermediate
    time_estimate: "2-4 hours (quarterly planning session)"
    time_es: "2-4 horas (sesión de planeación trimestral)"
    summary_es: "Revisa cómo te fue el trimestre pasado. Luego elige el número que más importa este trimestre, de 3 a 5 prioridades con responsable y fecha, y un tema que motive a tu equipo."
    frequency: quarterly
    tags: [execution, rocks, priorities, critical-number, planning]

  - id: worksheet-kpi-development
    decision: execution
    name: KPI Development Worksheet
    name_es: "Desarrollo de KPIs"
    node_path: execution/worksheets/kpi-development.yaml
    prerequisites: [worksheet-quarterly-priorities]
    outputs:
      - 1-2 KPIs per role (leading + lagging)
      - scoreboard template
    difficulty: intermediate
    time_estimate: "1-2 hours per team"
    time_es: "1-2 horas por equipo"
    summary_es: "Encuentra 1 o 2 indicadores por puesto: uno que anticipa el resultado y otro que lo confirma. Cada persona termina con su tarjeta de indicadores."
    frequency: annual or when roles change
    tags: [execution, KPI, metrics, leading-indicators, scoreboard]

  - id: worksheet-meeting-agenda
    decision: execution
    name: Meeting Rhythm Agenda Templates Worksheet
    name_es: "Agenda de reuniones"
    node_path: execution/worksheets/meeting-agenda.yaml
    prerequisites: [worksheet-execution-habits]
    outputs:
      - daily huddle agenda (15 min)
      - weekly meeting agenda (60-90 min)
      - monthly meeting agenda (half day)
    difficulty: beginner
    time_estimate: "1-2 hours to customize"
    time_es: "1-2 horas para adaptarlas"
    summary_es: "Agendas fijas para la junta diaria de 15 minutos, la semanal y la mensual, para que empiecen a tiempo y terminen con acuerdos claros."
    frequency: one-time setup; review quarterly
    tags: [execution, meetings, rhythm, huddle, agenda]

  # ── CASH (3) ───────────────────────────────────────────────────────────────

  - id: worksheet-ccc
    decision: cash
    name: Cash Conversion Cycle Worksheet
    name_es: "Ciclo de conversión de efectivo"
    node_path: cash/worksheets/ccc-worksheet.yaml
    prerequisites: []
    outputs:
      - total CCC in days
      - breakdown by sub-cycle (sales, delivery, collection)
    difficulty: intermediate
    time_estimate: "1-2 hours"
    time_es: "1-2 horas"
    summary_es: "Mide en días cuánto tarda en regresar cada peso que gastas: lo que tardas en vender, en producir y entregar, y en cobrar."
    frequency: quarterly
    tags: [cash, CCC, cycle, optimization]

  - id: worksheet-power-of-one
    decision: cash
    name: Power of One Worksheet
    name_es: "Poder del uno"
    node_path: cash/worksheets/power-of-one.yaml
    prerequisites: [worksheet-ccc]
    outputs:
      - ranked lever impact table
      - selected focus lever for the quarter
    difficulty: intermediate
    time_estimate: "2-3 hours"
    time_es: "2-3 horas"
    summary_es: "Calcula cuánto efectivo y utilidad ganas si mejoras 1% cada una de siete palancas, como precio, volumen, costos y días de cobro, y ordénalas de mayor a menor efecto."
    frequency: quarterly
    tags: [cash, power-of-one, levers, EBIT, impact]

  - id: worksheet-cash-flow-forecast
    decision: cash
    name: 13-Week Cash Flow Forecast Worksheet
    name_es: "Flujo de efectivo a 13 semanas"
    node_path: cash/worksheets/cash-flow-forecast.yaml
    prerequisites: [worksheet-ccc, worksheet-power-of-one]
    outputs:
      - 13-week cash projection
      - identified cash gap weeks
      - action plan for low-cash periods
    difficulty: advanced
    time_estimate: "3-4 hours initial; 30 min weekly update"
    time_es: "3-4 horas la primera vez; 30 minutos cada semana"
    summary_es: "Proyecta semana por semana, 13 semanas adelante, cuánto efectivo entra, cuánto sale y con cuánto cierras. Así ves una falta de efectivo antes de que llegue."
    frequency: weekly
    tags: [cash, forecast, cash-flow, planning, 13-week]
