id: tool-oppp
type: tool
name: One-Page Personal Plan (OPPP)
name_es: Plan Personal de Una Página (OPPP)
decision: people
summary: >
  A personal planning tool that mirrors the One-Page Strategic Plan (OPSP) at the individual
  level. It covers eight life areas (relationship, family, friends, health, work, money, fun,
  spiritual) across four rows: the 10-25 year vision, this year's goals, what to start doing
  and what to stop doing. A vision board turns each dream into an image, its main obstacle
  and an if-then plan. Used to align personal and professional goals with the company plan,
  so individuals feel their work serves their whole life.
relationships:
  - type: belongs-to
    target: decision-people
  - type: implements
    target: worksheet-oppp
  - type: measured-by
    target: metric-role-fit-score
tags: [people, personal-plan, OPPP, alignment, goals, vision-board]
metadata:
  difficulty: beginner
  time_estimate: "1-2 hours first time"
  frequency: quarterly
