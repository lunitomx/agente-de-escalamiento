id: metric-employee-satisfaction
type: metric
name: Employee Net Promoter Score (eNPS)
name_es: Indice de Satisfaccion del Empleado (eNPS)
decision: people
summary: >
  Measures how likely employees are to recommend the company as a place to work.
  A leading indicator of retention, engagement, and culture health.
  Gather employee feedback regularly through a simple "start/stop/keep" format.
relationships:
  - type: belongs-to
    target: decision-people
  - type: measured-by
    target: concept-right-people-right-seats
tags: [people, metric, engagement, satisfaction, retention]
metadata:
  unit: score
  direction: higher_better
  benchmark: "Track the trend against the company's documented baseline"
