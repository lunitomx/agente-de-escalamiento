id: metric-role-fit-score
type: metric
name: Role Fit Score
name_es: Puntuacion de Ajuste al Rol
decision: people
summary: >
  A composite score measuring how well each person's skills, passions, and strengths
  match their current role. Combines self-assessment (Love/Loathe exercise) with manager
  assessment and OPPP alignment. The right seat is not just competency — it is energized
  competency. Low role fit scores predict disengagement and eventual attrition even among
  values-aligned employees.
relationships:
  - type: belongs-to
    target: decision-people
  - type: measured-by
    target: tool-oppp
tags: [people, metric, role-fit, engagement, strengths, OPPP]
metadata:
  unit: score (1-5)
  direction: higher_better
  benchmark: "4+ is healthy; below 3 signals role redesign or reassignment needed"
