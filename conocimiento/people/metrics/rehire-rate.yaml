id: metric-rehire-rate
type: metric
name: Rehire Rate
name_es: Tasa de Recontratacion
decision: people
summary: >
  The percentage of current employees whom the leadership team would "enthusiastically
  rehire" if starting over today. Ask: "Would you enthusiastically rehire everyone on
  your team?" A high rehire rate signals strong hiring practices and values alignment.
  A low or declining rate signals a talent or culture problem that needs evidence-based
  review.
relationships:
  - type: belongs-to
    target: decision-people
  - type: measured-by
    target: tool-topgrading
tags: [people, metric, hiring, quality, talent, topgrading]
metadata:
  unit: percentage
  direction: higher_better
  benchmark: "Compare with the leadership team's documented target and prior quarters"
