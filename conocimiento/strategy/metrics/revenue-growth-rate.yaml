id: metric-revenue-growth-rate
type: metric
name: Revenue Growth Rate
name_es: Tasa de Crecimiento de Ingresos
decision: strategy
summary: >
  Year-over-year revenue growth expressed as a percentage. Use it as a primary signal
  that the strategy is producing sustainable demand, while checking margin and cash so
  growth is not value-destroying. Compare the trend with inflation, a documented
  industry benchmark, and the company's own baseline. Track it annually as a BHAG-level
  indicator and quarterly as a progress signal.
relationships:
  - type: belongs-to
    target: decision-strategy
  - type: measured-by
    target: concept-bhag
tags: [strategy, metric, revenue, growth, BHAG, performance]
metadata:
  unit: percentage (YoY)
  direction: higher_better
  benchmark: "Use a documented industry comparison and the company's own baseline"
