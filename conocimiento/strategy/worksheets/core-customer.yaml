id: worksheet-core-customer
type: worksheet
name: Core Customer Definition Worksheet
name_es: Hoja de Trabajo de Definicion del Cliente Central
decision: strategy
summary: >
  A structured worksheet for identifying and describing the Core Customer. Guides the
  team through listing real individual customers, extracting shared attributes (wants,
  needs, fears), and drafting a 10-20 word Core Customer description. Also includes
  analysis of how the Core Customer's needs drive brand promise design.
relationships:
  - type: belongs-to
    target: decision-strategy
  - type: implements
    target: concept-core-customer
tags: [strategy, worksheet, core-customer, persona, targeting, 7-strata]
metadata:
  fields:
    - "List top 5 Core Customers as specific individuals (name/role/company)"
    - "Attributes they share: wants (what they desire), needs (what they require), fears (what they want to avoid)"
    - "Top 3-5 shared attributes ranked by importance"
    - "Core Customer draft description (10-20 words)"
    - "Describe your Core Customer's need your product/service fills"
    - "Brand Promise check: does your promise fill the need or just a want?"
  output: "10-20 word Core Customer description ready for 7 Strata and OPSP"
  difficulty: intermediate
  time_estimate: "1-2 hours"
  frequency: annually
