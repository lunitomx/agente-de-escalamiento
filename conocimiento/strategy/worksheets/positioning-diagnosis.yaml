id: worksheet-positioning-diagnosis
type: worksheet
name: Positioning Diagnosis
name_es: Diagnóstico de posicionamiento
decision: strategy
summary: >
  Compara tu sitio web con el de dos competidores y descubre dónde dicen lo
  mismo. Luego responde una pregunta a la vez: qué haces distinto, a qué
  renuncias, a dónde se van tu tiempo y tu dinero. Terminas con tu posición
  en una oración y un primer paso.
relationships:
  - type: belongs-to
    target: decision-strategy
  - type: implements
    target: concept-strategic-positioning
  - type: implements
    target: concept-resource-allocation
tags: [strategy, worksheet, positioning, competitors, trade-offs, resource-allocation]
metadata:
  fields:
    - negocio
    - sitios
    - lectura-de-sitios
    - mejor-o-distinto
    - tipo-de-posicion
    - renuncias
    - encaje
    - continuidad
    - tiempo-y-dinero
    - solo-esta-vez
    - motivacion
