id: tool-x-factor
type: tool
name: X-Factor
name_es: Factor X (Ventaja Subyacente 10x-100x)
decision: strategy
summary: >
  The sixth stratum: a 10x to 100x underlying structural advantage that competitors
  cannot easily replicate. The X-Factor is not a competitive feature — it is a
  fundamental asymmetry in the business model, access, or position. Classic example:
  Outback Steakhouse's X-Factor was dinner-only hours, allowing them to use smaller
  kitchens profitably. Identifying the X-Factor forces leadership to ask: "What do we
  have that would take a competitor 10 years and unlimited capital to replicate?"
