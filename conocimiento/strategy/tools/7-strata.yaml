id: tool-7-strata
type: tool
name: 7 Strata of Strategy
name_es: 7 Estratos de Estrategia
decision: strategy
summary: >
  A seven-component framework for designing a differentiated strategy that dominates
  an industry. The seven components in order: (1) Core Customer description, (2) Brand
  Promises with measurable guarantee, (3) Differentiating Activities that deliver the
  promises, (4) One-Phrase Strategy (the single overriding theme), (5) X-Factor (the
  10x-100x underlying advantage), (6) Profit per X (the economic engine metric),
  (7) BHAG (the 25-year goal). Working through all seven reveals whether the strategy
  is truly differentiated or merely aspirational.
