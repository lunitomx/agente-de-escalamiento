id: tool-sandbox
type: tool
name: Sandbox
name_es: Caja de Arena Estrategica
decision: strategy
summary: >
  Define los límites dentro de los que la empresa compite. Responde cuatro
  preguntas: DÓNDE juegas (zonas geográficas), QUÉ vendes (3 a 5 categorías de
  producto o servicio), a quién le vendes por qué canales de venta (socios,
  directo, en línea, menudeo, mayoreo) y el pronóstico de cómo cambiará esa caja
  en 3 a 5 años. La Caja de arena evita la sobreextensión: la empresa que quiere
  atender a todos no atiende bien a nadie. Ejemplo: "Tortillería El Sol: zona
  metropolitana de Guadalajara; tortilla, totopo y masa; venta directa y
  mayoreo a fondas; en 5 años, tiendas de conveniencia". Vive en la cuarta
  columna del OPSP junto a las actividades diferenciadoras.
questions:
  - "DÓNDE: ¿en qué zonas geográficas vas a competir?"
  - "QUÉ: ¿cuáles son las 3 a 5 categorías de producto o servicio que vendes?"
  - "Canales: ¿a quién le vendes y por qué canales (socios, directo, en línea, menudeo, mayoreo)?"
  - "Pronóstico: ¿cómo cambiarán tus zonas, categorías y canales en 3 a 5 años?"
relationships:
  - type: belongs-to
    target: decision-strategy
  - type: requires
    target: concept-core-customer
  - type: feeds-into
    target: tool-opsp
tags: [strategy, sandbox, geography, targeting, focus, market]
metadata:
  difficulty: intermediate
  time_estimate: "1-2 hours"
  frequency: annually
