id: tool-swt
type: tool
name: "SWT — Strengths, Weaknesses, Trends"
name_es: "SWT — Fortalezas, Debilidades, Tendencias"
decision: strategy
summary: >
  An augmented strategic analysis tool that replaces the traditional SWOT. SWT drops
  Opportunities (which are obvious from Trends) and focuses on: Strengths (internal
  capabilities to leverage), Weaknesses (internal gaps to address), and Trends
  (external forces shaping the industry — macro, competitive, technological). The key
  insight: opportunities are derived from the intersection of your strengths and
  favorable trends. SWT output feeds the bottom of the OPSP and informs annual priorities.
