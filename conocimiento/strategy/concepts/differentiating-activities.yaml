tags: [strategy, differentiation, competitive-advantage, activities, Porter, 7-strata]
metadata:
  difficulty: advanced
  application: >
    List 10 things you do to deliver your brand promise. Cross out those your competitors
    also do. What remains (if anything) are your differentiating activities. If nothing
    remains, you don't have a strategy — you have a list of features. Build toward 3-5
    activities that are structurally hard for competitors to replicate.
