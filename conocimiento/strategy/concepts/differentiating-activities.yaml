id: concept-differentiating-activities
type: concept
name: Differentiating Activities
name_es: Actividades Diferenciadoras
decision: strategy
summary: >
  The 3-5 unique operational activities that make delivering the Brand Promise possible
  and that competitors cannot easily replicate. Analogous to Michael Porter's "activities
  that fit and reinforce each other." These are not just things you do well — they are
  the specific ways you deliver on your brand promise that are structurally hard to copy.
  In the 7 Strata, differentiating activities are the third component and the operational
  foundation of sustainable competitive advantage.
source:
  book_chapter: "THE 7 STRATA OF STRATEGY"
  file: "metodologias_parsed/strategy_workbook.txt"
  file_line: 1892
