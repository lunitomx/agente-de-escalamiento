id: concept-brand-promise
type: concept
name: Brand Promise
name_es: Promesa de Marca
decision: strategy
summary: >
  The specific, measurable promises the company makes to its Core Customer:
  1 main promise and 2 supporting promises, each with a weekly measure the
  leadership team reviews. Not an aspiration — a commitment the customer can verify.
  The main promise is backed by a guarantee (catalytic mechanism) that triggers if
  it is broken, e.g., "delivered in 30 minutes or it's free." Each promise also names
  its anti-promises: what the company will NOT do, and the trade-off the customer
  gets in return, so the promises stay deliverable. In the 7 Strata, brand promises
  are the second component: they must fill the Core Customer's NEED (not want) and be
  uniquely deliverable by the company's Differentiating Activities.
relationships:
  - type: belongs-to
    target: decision-strategy
  - type: requires
    target: concept-core-customer
  - type: feeds-into
    target: concept-differentiating-activities
  - type: feeds-into
    target: tool-opsp
  - type: measured-by
    target: metric-brand-promise-kept-rate
  - type: measured-by
    target: metric-days-sales-outstanding
tags: [strategy, brand, promise, differentiation, customer, guarantee]
metadata:
  difficulty: intermediate
  application: >
    Test each brand promise: does it fill the Core Customer's NEED (not just a want)?
    Is it measurable — does it have a weekly measure? Is it hard for competitors to
    match? Does your Guarantee create real financial risk if broken? Track a loyalty
    measure (NPS or similar). If not, it's marketing copy, not a brand promise.
