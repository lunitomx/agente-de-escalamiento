source_requirements:
  - id: SRC-CASH-001
    statement: "Interpret the owner's real financial workbooks, ask questions, reconstruct supported statements, and explain cash decisions without guessing."
  - id: SRC-CATALOG-001
    statement: "Produce a Spanish functionality catalog and PDF that truthfully state what works, evidence, limits, prerequisites, and unavailable capabilities."
  - id: SRC-COACH-001
    statement: "Guide the owner through People, Strategy, Execution, and Cash, including strategy, vision, priorities, and follow-up."
  - id: SRC-COCKPIT-001
    statement: "Provide a visual 0-100 company diagnostic that identifies pain and lets the owner inspect supporting evidence."
  - id: SRC-EVIDENCE-001
    statement: "Use only supplied or verified company data, ask material clarifying questions, and distinguish facts, inferences, and unknowns."
  - id: SRC-INGEST-001
    statement: "Accept the owner's existing files without requiring an ESCALA template and report unsupported or ambiguous inputs explicitly."
  - id: SRC-INSTALL-001
    statement: "Install and operate ESCALA only on the machine of the person who installed it, with a reproducible local lifecycle."
  - id: SRC-LOCAL-001
    statement: "Keep runtime and authoritative company state on the installer machine with no hosted ESCALA service or cloud database."
  - id: SRC-MEETING-001
    statement: "Review daily and weekly meeting transcripts, extract accountable work, and report team health and trends each day."
  - id: SRC-QUALIFY-001
    statement: "Test the complete product as an entrepreneur with a synthetic company and prove every shipped capability and failure boundary."
  - id: SRC-SHARING-001
    statement: "Allow team exchange through a user-selected local Google Drive, OneDrive, or plain filesystem folder without cloud APIs."
  - id: SRC-SQLITE-001
    statement: "Never place authoritative SQLite or canonical company state in a synchronized or shared folder."
