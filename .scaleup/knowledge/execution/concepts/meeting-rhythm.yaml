tags: [execution, meetings, rhythm, cadence, daily-huddle, weekly, quarterly, annual]
metadata:
  difficulty: beginner
  application: >
    Implement in order: Daily Huddle first (lowest resistance, highest daily impact),
    then Weekly Meeting, then Quarterly Planning. Annual Planning last — it requires
    the others to be functioning well first. Don't try to implement all five at once.
