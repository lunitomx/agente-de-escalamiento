id: concept-meeting-rhythm
type: concept
name: Meeting Rhythm
name_es: Ritmo de Reuniones
decision: execution
summary: >
  A structured cadence of five meeting types that replace ad-hoc, unproductive meetings
  with purposeful communication rhythms: Daily Huddle (15 min), Weekly Team Meeting
  (60-90 min), Monthly Management Meeting (half day), Quarterly Planning Session (1-2 days),
  Annual Planning Session (2-3 days). Each serves a distinct purpose: daily for tactical
  updates, weekly for accountability, monthly for learning and adjustments, quarterly for
  strategy refresh, annually for the full OPSP reset. The rhythm eliminates the need for
  impromptu meetings that disrupt deep work.
