id: concept-critical-number
type: concept
name: Critical Number
name_es: Numero Critico
decision: execution
summary: >
  The single most important metric that, if improved this quarter, will have the greatest
  impact on the company's performance. The Critical Number focuses the entire organization
  on one thing at a time. It can be a financial metric (gross margin %) or an operational
  metric (days to delivery). Every team member should know the company's Critical Number
  and have a personal Critical Number aligned with it — creating clear line of sight from
  individual work to company outcome. Tracked weekly, tied to the Quarterly Theme.
source:
