tags: [execution, critical-number, KPI, focus, quarterly, alignment]
metadata:
  difficulty: beginner
  application: >
    At the start of each quarter, identify one Critical Number. Post it everywhere.
    Every weekly meeting opens with the Critical Number update. Each team member
    defines their personal Critical Number that feeds the company's.
