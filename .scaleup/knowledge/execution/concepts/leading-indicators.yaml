tags: [execution, KPI, leading-indicator, lagging-indicator, data, metrics]
metadata:
  difficulty: intermediate
  application: >
    For each role: identify 1 lagging KPI (what they're ultimately measured on) and
    1-2 leading KPIs (activities that predict the lagging result). Track leading KPIs
    in the daily huddle; review lagging KPIs in the weekly team meeting.
