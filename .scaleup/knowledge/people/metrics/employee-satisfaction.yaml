  file_line: 5076
relationships:
  - type: belongs-to
    target: decision-people
  - type: measured-by
    target: concept-right-people-right-seats
tags: [people, metric, engagement, satisfaction, retention]
metadata:
  unit: score
  direction: higher_better
  benchmark: "Above 50 is excellent, above 30 is good"
