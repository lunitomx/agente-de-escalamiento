id: tool-face
type: tool
name: "FACe — Function Accountability Chart"
name_es: "Grafico de Responsabilidad Funcional (FACe)"
decision: people
summary: >
  A one-page chart that lists every business function (Head of Company, Sales, Finance,
  Operations, HR, IT, Customer Advocacy, etc.), names one person accountable for each,
  and defines the leading KPIs for that function. Forces clarity on ownership. The "e"
  stands for the energy and entrepreneurial spirit the accountable person must bring.
  Rule: one person per function. If you can't name one person, you have an accountability gap.
source:
