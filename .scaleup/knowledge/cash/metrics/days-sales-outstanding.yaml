id: metric-days-sales-outstanding
type: metric
name: Days Sales Outstanding (DSO)
name_es: Dias de Ventas Pendientes de Cobro (DSO)
decision: cash
summary: >
  The average number of days from invoice to cash collection. The primary measure
  of the Billing & Payment sub-cycle of the CCC. High DSO (40+ days) signals
  collection inefficiency, customer financial stress, or invoicing delays. Every
  1-day reduction in DSO frees working capital equal to 1 day of revenue. Tracked
  via the Power of One worksheet — DSO is lever 5 of the 7 financial levers.
source:
  book_chapter: "SCALING UP CASH"
  file: "metodologias_parsed/cash_workbook.txt"
  file_line: 963
relationships:
  - type: belongs-to
    target: decision-cash
  - type: measured-by
    target: tool-ar-optimization
tags: [cash, metric, DSO, accounts-receivable, collection, CCC]
metadata:
  unit: days
  direction: lower_better
  benchmark: "Target: under 30 days; best practice: under 15 days or upfront payment"
