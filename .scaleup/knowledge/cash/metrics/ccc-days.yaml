    target: decision-cash
  - type: measured-by
    target: concept-ccc
tags: [cash, metric, CCC, days, working-capital, efficiency]
metadata:
  unit: days
  direction: lower_better
  benchmark: "Industry-leading: 0-15 days; average: 30-60 days; over 90 days signals serious cash risk"
