    target: decision-cash
  - type: measured-by
    target: concept-revenue-per-employee
tags: [cash, metric, revenue-per-employee, efficiency, headcount, scaling]
metadata:
  unit: "currency / employee (annual)"
  direction: higher_better
  benchmark: "Varies: services $150K+, SaaS $200K+, manufacturing $250K+. Trend matters more than absolute."
