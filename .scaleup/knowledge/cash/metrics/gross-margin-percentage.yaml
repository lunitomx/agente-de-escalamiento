id: metric-gross-margin-percentage
type: metric
name: Gross Margin Percentage
name_es: Porcentaje de Margen Bruto
decision: cash
summary: >
  Gross profit divided by revenue, expressed as a percentage. The Simple Numbers
  framework treats gross margin % as the key structural health indicator: if GM% is
  declining, the business model is deteriorating regardless of revenue growth. Every
  pricing decision, cost reduction, and product mix change affects GM%. Growing
  companies must protect GM% as they scale — operational efficiency gains should
  flow to the bottom line, not be consumed by revenue growth costs.
