id: worksheet-ccc
type: worksheet
name: Cash Conversion Cycle Worksheet
name_es: Hoja de Trabajo del Ciclo de Conversion de Efectivo
decision: cash
summary: >
  Maps the complete cash cycle from the moment you spend a dollar to the moment
  you get it back. Breaks down into three sub-cycles: sales cycle, make/production
  cycle, and delivery/collection cycle. Measured in days.
source:
  book_chapter: "Cash Conversion Cycle (CCC)"
  book_line: 5960
  workbook: cash_workbook.md
relationships:
  - type: belongs-to
    target: decision-cash
  - type: implements
    target: concept-ccc
  - type: feeds-into
    target: tool-power-of-one
tags: [cash, ccc, cycle, days, optimization]
metadata:
  fields:
    - sales_cycle_days: "Days from first contact to signed deal"
    - make_cycle_days: "Days to produce/deliver the product or service"
    - collection_cycle_days: "Days from delivery to cash received"
    - total_ccc_days: "Sum of all three cycles"
  output: "Total CCC in days + breakdown by sub-cycle for optimization"
  difficulty: intermediate
  time_estimate: "1-2 hours"
  frequency: quarterly
