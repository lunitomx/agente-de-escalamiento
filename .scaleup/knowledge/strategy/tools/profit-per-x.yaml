id: tool-profit-per-x
type: tool
name: Profit per X
name_es: Beneficio por X (Motor Economico)
decision: strategy
summary: >
  The seventh stratum: the single economic denominator that best represents how the
  business generates profit — the "X" in "Profit per X." Borrowed from Jim Collins'
  "Good to Great." Examples: profit per customer, profit per location, profit per
  employee, profit per transaction. Identifying the right X clarifies resource
  allocation decisions and reveals the true economic engine of the business. Used
  alongside the BHAG in the OPSP's strategic column.
