id: tool-opsp
type: tool
name: One-Page Strategic Plan (OPSP)
name_es: Plan Estrategico de Una Pagina (OPSP)
decision: strategy
summary: >
  The central tool of Scaling Up — consolidates vision, strategy, and execution on one
  page. Columns 1-3 are strategic thinking: Core Values/Purpose, BHAG + 3-5
  year targets and Key Capabilities, then Brand Promises + Sandbox. Columns 4-7
  are execution planning: annual priorities/critical number followed by
  Q1-Q3. Every column is represented through Actions / Goals / Targets; each
  execution cell records Your Accountability. Updated quarterly by the full
  leadership team. The SWT summary appears at the bottom.
