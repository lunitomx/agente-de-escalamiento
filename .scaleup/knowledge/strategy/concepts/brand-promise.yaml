tags: [strategy, brand, promise, differentiation, customer, guarantee]
metadata:
  difficulty: intermediate
  application: >
    Test your brand promise: does it fill the Core Customer's NEED (not just a want)?
    Is it measurable — can you track whether you kept it? Does your Guarantee create
    real financial risk if broken? If not, it's marketing copy, not a brand promise.
