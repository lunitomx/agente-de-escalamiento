id: concept-brand-promise
type: concept
name: Brand Promise
name_es: Promesa de Marca
decision: strategy
summary: >
  A 10-20 word statement of the specific, measurable, and kept promise the company
  makes to its Core Customer. Not an aspiration — a commitment that can be verified.
  The best brand promises have a guarantee mechanism (catalytic mechanism) that triggers
  if the promise is broken, e.g., "delivered in 30 minutes or it's free." In the 7 Strata,
  brand promises are the second component: they must fill the Core Customer's NEED (not
  want) and be uniquely deliverable by the company's Differentiating Activities.
source:
