tags: [strategy, purpose, mission, why, culture, identity]
metadata:
  difficulty: advanced
  application: >
    The CEO should be able to deliver the Core Purpose in 60 seconds and have every
    employee repeat it accurately. If it takes a slide deck to explain, it's not a
    Core Purpose yet — it's a mission statement. Simplify until it's visceral.
