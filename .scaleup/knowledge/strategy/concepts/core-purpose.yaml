id: concept-core-purpose
type: concept
name: Core Purpose
name_es: Proposito Central
decision: strategy
summary: >
  The fundamental reason the company exists beyond making money — the "why" that
  keeps hearts engaged. The Core Purpose is the top leader's stump speech: a short,
  emotionally resonant statement that never changes regardless of market conditions.
  Distinct from Core Values (the "how") and BHAG (the "what"). A strong Core Purpose
  answers: "If we disappeared tomorrow, what would the world lose?" In the OPSP,
  Core Purpose anchors the first column and grounds all strategic decisions.
source:
  book_chapter: "THE CORE"
  file: "scaling_up_llamaparse.txt"
  file_line: 1496
