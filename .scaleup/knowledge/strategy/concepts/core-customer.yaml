tags: [strategy, customer, target, persona, segmentation, 7-strata]
metadata:
  difficulty: intermediate
  application: >
    List your top 5 core customers as real individuals. Extract the 3-5 attributes
    they share. Draft a 10-20 word description. Test it: does your marketing speak
    directly to this person? If you're trying to serve everyone, you're serving nobody.
