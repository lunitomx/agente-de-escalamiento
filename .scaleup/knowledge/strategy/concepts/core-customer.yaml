id: concept-core-customer
type: concept
name: Core Customer
name_es: Cliente Central
decision: strategy
summary: >
  A precise, 10-20 word description of the specific real person (not a segment or
  demographic) who is the ideal buyer for your product or service. The Core Customer
  has specific wants, needs, and fears — and your product is designed for them, not
  for everyone. Getting the Core Customer wrong leads to misaligned brand promises,
  wrong differentiating activities, and a sandbox that is too broad to win in.
  In the 7 Strata, Core Customer is the first component — it defines who everything
  else is designed for.
source:
