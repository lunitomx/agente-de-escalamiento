[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "escala-coaching"
version = "1.0.0"
description = "Motor de coaching del Agente de Escalamiento"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["coaching*", "validators*"]

[tool.setuptools.package-data]
"conocimiento" = ["**/*.yaml", "**/*.yml"]

[tool.pytest.ini_options]
# Bare `pytest` only collects the project's own suites — keeps it from
# recursing into untracked scratch dirs (e.g. referencias-humberto/).
testpaths = ["coaching", "escala_server", "tests"]
norecursedirs = [
    ".git", ".venv", "build", "dist", "node_modules",
    "referencias-humberto", ".scaleup", "work", ".raise",
]
