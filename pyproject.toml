[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "escala-coaching"
version = "1.0.0"
description = "Motor de coaching del Agente de Escalamiento"
requires-python = ">=3.10"
dependencies = [
    "fpdf2>=2.8.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.entry-points."rai.gates"]
e37-req-001 = "validators.e37_gates:E37RequirementGate001"
e37-req-002 = "validators.e37_gates:E37RequirementGate002"
e37-req-003 = "validators.e37_gates:E37RequirementGate003"
e37-req-004 = "validators.e37_gates:E37RequirementGate004"
e37-req-005 = "validators.e37_gates:E37RequirementGate005"
e37-req-006 = "validators.e37_gates:E37RequirementGate006"
e37-req-007 = "validators.e37_gates:E37RequirementGate007"
e38-req-001 = "validators.e38_gates:E38RequirementGate001"
e38-req-002 = "validators.e38_gates:E38RequirementGate002"
e38-req-003 = "validators.e38_gates:E38RequirementGate003"
e38-req-004 = "validators.e38_gates:E38RequirementGate004"
e38-req-005 = "validators.e38_gates:E38RequirementGate005"
e38-req-006 = "validators.e38_gates:E38RequirementGate006"
e38-req-007 = "validators.e38_gates:E38RequirementGate007"
e39-req-001 = "validators.e39_gates:E39RequirementGate001"
e39-req-002 = "validators.e39_gates:E39RequirementGate002"
e39-req-003 = "validators.e39_gates:E39RequirementGate003"
e39-req-004 = "validators.e39_gates:E39RequirementGate004"
e39-req-005 = "validators.e39_gates:E39RequirementGate005"
e39-req-006 = "validators.e39_gates:E39RequirementGate006"
e39-req-007 = "validators.e39_gates:E39RequirementGate007"
e40-req-001 = "validators.e40_gates:E40RequirementGate001"
e40-req-002 = "validators.e40_gates:E40RequirementGate002"
e40-req-003 = "validators.e40_gates:E40RequirementGate003"
e40-req-004 = "validators.e40_gates:E40RequirementGate004"
e40-req-005 = "validators.e40_gates:E40RequirementGate005"
e40-req-006 = "validators.e40_gates:E40RequirementGate006"
e40-req-007 = "validators.e40_gates:E40RequirementGate007"
e40-req-008 = "validators.e40_gates:E40RequirementGate008"
e41-req-001 = "validators.e41_gates:E41RequirementGate001"
e41-req-002 = "validators.e41_gates:E41RequirementGate002"
e41-req-003 = "validators.e41_gates:E41RequirementGate003"
e41-req-004 = "validators.e41_gates:E41RequirementGate004"
e41-req-005 = "validators.e41_gates:E41RequirementGate005"
e41-req-006 = "validators.e41_gates:E41RequirementGate006"
e41-req-007 = "validators.e41_gates:E41RequirementGate007"

[project.scripts]
escala = "escala_server.lifecycle.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=9.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.0",
    "ruff>=0.16.4",
]

[tool.ruff]
extend-exclude = [
    ".*",
    "referencias-humberto",
]

[tool.ruff.lint]
# Product gate: syntax/import/undefined-name errors. Security and refactor rules
# are reviewed in focused RaiSE quality reviews, not inherited from host config.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pyright]
include = [
    "coaching",
    "escala_server",
    "tests",
    "validators",
]
exclude = [
    "referencias-humberto",
]

[tool.pytest.ini_options]
norecursedirs = [
    "referencias-humberto",
]
testpaths = [
    "tests",
    "coaching",
]
markers = [
    "e2e: end-to-end qualification tests that exercise full product paths",
]

[tool.setuptools.packages.find]
include = ["coaching*", "validators*", "escala_server*"]

[tool.setuptools.package-data]
"conocimiento" = ["**/*.yaml", "**/*.yml"]
