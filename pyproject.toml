[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "escala-coaching"
version = "1.0.0"
description = "Motor de coaching del Agente de Escalamiento"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["coaching*", "validators*"]

[tool.setuptools.package-data]
"conocimiento" = ["**/*.yaml", "**/*.yml"]
