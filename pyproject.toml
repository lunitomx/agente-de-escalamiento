[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "escala-coaching"
version = "1.0.0"
description = "Motor de coaching del Agente de Escalamiento"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

[tool.ruff]
extend-exclude = [
    ".*",
    "referencias-humberto",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pyright]
include = [
    "coaching",
    "escala_server",
    "tests",
    "validators",
]
exclude = [
    "referencias-humberto",
]

[tool.pytest.ini_options]
norecursedirs = [
    "referencias-humberto",
]
testpaths = [
    "tests",
    "coaching",
]

[tool.setuptools.packages.find]
include = ["coaching*", "validators*"]

[tool.setuptools.package-data]
"conocimiento" = ["**/*.yaml", "**/*.yml"]
