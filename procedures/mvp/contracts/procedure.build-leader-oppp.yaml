id: procedure.build-leader-oppp
version: 1.0.0
provenance: source-synthesis
trigger:
- El líder quiere construir un plan personal.
non_trigger:
- No sustituya una conversación personal detallada.
objective: Proponer un plan personal con vacíos explícitos.
required_inputs:
- id: input.leader-context
  description: Contexto autorizado del líder o estado desconocido.
  required: true
  accepted_statuses:
  - known
  - unknown
optional_inputs:
- id: input.personal-dimensions
  description: Detalles autorizados de dimensiones personales.
  required: false
  accepted_statuses:
  - known
  - unknown
  - not-applicable
interview_questions:
- id: question.personal-outcome
  prompt: ¿Qué resultado personal importa más ahora?
  required: true
steps:
- id: step.collect-personal-context
  action: Registre respuestas detalladas y vacíos explícitos.
  produces:
  - artifact.leader-oppp
decision_rules:
- id: rule.no-generic-plan
  statement: No complete un plan con frases genéricas.
warnings:
- id: warning.no-silent-inference
  statement: No infiera prioridades personales no confirmadas.
