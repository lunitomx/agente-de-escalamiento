id: procedure.quarterly-review
version: 1.0.0
provenance: source-synthesis
trigger:
- El equipo quiere revisar el trimestre actual.
non_trigger:
- No atribuya causalidad sin evidencia confirmada.
objective: Proponer una nueva iteración o declarar evidencia faltante.
required_inputs:
- id: input.current-quarter
  description: Estado autorizado del trimestre o desconocido.
  required: true
  accepted_statuses:
  - known
  - unknown
optional_inputs:
- id: input.review-evidence
  description: Evidencia autorizada de resultados del trimestre.
  required: false
  accepted_statuses:
  - known
  - unknown
  - not-applicable
interview_questions:
- id: question.review-learning
  prompt: ¿Qué resultado y aprendizaje deben revisarse?
  required: true
steps:
- id: step.review-quarter
  action: Compare evidencia autorizada y declare incertidumbre.
  produces:
  - artifact.quarterly-review
decision_rules:
- id: rule.no-invented-causality
  statement: No atribuya resultados a causas no verificadas.
warnings:
- id: warning.no-silent-inference
  statement: No convierta una hipótesis en aprendizaje confirmado.
output_contract:
  artifact:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  assumptions: []
  open_questions:
  - ¿Qué evidencia falta para la siguiente iteración?
  owner:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  kpi:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  who_what_when:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  review_cadence:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
acceptance_criteria:
- id: criterion.iteration-bounded
  statement: La revisión separa hechos, supuestos y preguntas.
state_updates:
- id: state.propose-quarterly-review
  path: state/current-quarter.yaml
  mode: proposed
  confirmation: null
handoff:
  next_procedure_id: procedure.diagnose-primary-constraint
  condition: La revisión revela un nuevo foco posible.
