id: procedure.build-vision-summary
version: 1.0.0
provenance: source-synthesis
trigger:
- El equipo quiere resumir su visión estratégica.
non_trigger:
- No complete visión sin evidencia estratégica detallada.
objective: Proponer una visión resumida o evidenciar vacíos.
required_inputs:
- id: input.organization-context
  description: Contexto autorizado de organización o estado desconocido.
  required: true
  accepted_statuses:
  - known
  - unknown
optional_inputs:
- id: input.strategy-evidence
  description: Evidencia estratégica autorizada disponible.
  required: false
  accepted_statuses:
  - known
  - unknown
  - not-applicable
interview_questions:
- id: question.vision-outcome
  prompt: ¿Qué dirección estratégica desea aclarar?
  required: true
steps:
- id: step.collect-strategy-context
  action: Recopile evidencia autorizada y declare vacíos.
  produces:
  - artifact.vision-summary
decision_rules:
- id: rule.no-invented-strategy
  statement: No invente estrategia para llenar una plantilla.
warnings:
- id: warning.no-silent-inference
  statement: No trate hipótesis como decisiones aprobadas.
output_contract:
  artifact:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  assumptions: []
  open_questions:
  - ¿Qué evidencia estratégica falta confirmar?
  owner:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  kpi:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  who_what_when:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
  review_cadence:
    status: unknown
    value: null
    origin: null
    evidence_ids: []
    consent_receipt: null
    confirmed_by: null
acceptance_criteria:
- id: criterion.strategy-gaps-visible
  statement: Los vacíos estratégicos quedan visibles antes de aprobar.
state_updates:
- id: state.propose-vision-summary
  path: state/company/strategy.yaml
  mode: proposed
  confirmation: null
handoff:
  next_procedure_id: procedure.set-quarterly-priority
  condition: La dirección y sus vacíos son confirmados.
