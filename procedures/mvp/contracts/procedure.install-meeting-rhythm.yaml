id: procedure.install-meeting-rhythm
version: 1.0.0
provenance: source-synthesis
trigger:
- El equipo quiere definir un ritmo de reuniones.
non_trigger:
- No imponga reuniones sin necesidad de seguimiento.
objective: Proponer cuatro ritmos verificables sin ejecutarlos.
required_inputs:
- id: input.execution-context
  description: Contexto de ejecución y prioridad propuesta o desconocida.
  required: true
  accepted_statuses:
  - known
  - unknown
optional_inputs:
- id: input.existing-rhythm
  description: Cadencias existentes, propósito y responsables autorizados.
  required: false
  accepted_statuses:
  - known
  - unknown
  - not-applicable
interview_questions:
- id: question.rhythm-gap
  prompt: ¿Qué propósito, dueño y restricciones tiene cada ritmo propuesto?
  required: true
steps:
- id: step.propose-meeting-rhythm
  action: Proponga cuatro ritmos sin calendario ni automatización.
  produces:
  - artifact.meeting-rhythm
decision_rules:
- id: rule.purpose-before-meeting
  statement: Cada ritmo requiere propósito, dueño y aceptación explícita.
warnings:
- id: warning.no-silent-inference
  statement: No cree reuniones, calendarios ni automatizaciones.
