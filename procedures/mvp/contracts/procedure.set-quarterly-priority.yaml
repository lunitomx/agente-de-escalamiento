id: procedure.set-quarterly-priority
version: 1.0.0
provenance: source-synthesis
trigger:
- El equipo quiere definir una prioridad trimestral.
non_trigger:
- No priorice sin foco y evidencia confirmados.
objective: Proponer un plan trimestral verificable.
required_inputs:
- id: input.primary-constraint
  description: Diagnóstico confirmado o propuesto con restricción única.
  required: true
  accepted_statuses:
  - known
  - unknown
optional_inputs:
- id: input.priority-evidence
  description: Baseline, unidad, dueño y compromisos autorizados.
  required: false
  accepted_statuses:
  - known
  - unknown
  - not-applicable
interview_questions:
- id: question.quarterly-outcome
  prompt: ¿Qué resultado único confirma baseline, unidad, dueño y fecha?
  required: true
steps:
- id: step.propose-quarterly-priority
  action: Proponga prioridad, Critical Number y compromisos sin ejecutar cambios.
  produces:
  - artifact.quarterly-priority
decision_rules:
- id: rule.one-priority
  statement: Permita una prioridad o exija justificación explícita.
warnings:
- id: warning.no-silent-inference
  statement: No acepte KPI sin unidad, baseline, dueño y fecha.
