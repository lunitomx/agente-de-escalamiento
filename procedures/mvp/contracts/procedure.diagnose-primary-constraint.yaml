id: procedure.diagnose-primary-constraint
version: 1.0.0
provenance: source-synthesis
trigger:
- El líder pide identificar una restricción primaria.
non_trigger:
- Use un especialista cuando ya eligió una herramienta.
objective: Proponer foco verificable o registrar evidencia faltante.
required_inputs:
- id: input.company-context
  description: Contexto autorizado de empresa o estado desconocido.
  required: true
  accepted_statuses:
  - known
  - unknown
optional_inputs:
- id: input.decision-evidence
  description: Evidencia autorizada sobre decisiones actuales.
  required: false
  accepted_statuses:
  - known
  - unknown
  - not-applicable
interview_questions:
- id: question.primary-pain
  prompt: ¿Qué resultado limita más el avance ahora?
  required: true
steps:
- id: step.collect-context
  action: Recopile sólo contexto autorizado y registre desconocidos.
  produces:
  - artifact.diagnostic-summary
decision_rules:
- id: rule.one-primary-constraint
  statement: Seleccione un foco sólo con evidencia suficiente.
warnings:
- id: warning.no-silent-inference
  statement: No convierta información faltante en un hecho.
